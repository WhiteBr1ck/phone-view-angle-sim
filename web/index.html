<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>可视角度仿真</title>
<link rel="stylesheet" href="style.css?v=16">
</head>
<body data-layout="wide">
<div class="sframe" id="sf0"></div>
<div class="sframe" id="sf1"></div>
<canvas id="gl" aria-label="手机屏幕可视角仿真画面"></canvas>
<div id="scene3d" aria-label="三维场景演示"></div>
<!-- 三维场景演示（做动画用）：默认不显示，从“画面 → 更多”进入；进入后顶部出现这个切换，可回到屏幕仿真 -->
<nav class="app-mode seg" id="appMode" aria-label="模式">
  <button data-v="scene">场景演示</button>
  <button data-v="sim" class="on">屏幕仿真</button>
</nav>

<!-- 宽屏时整体移入左栏；其他布局时浮在舞台左上角 -->
<header id="hud">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>可视角度仿真
    
  </div>
  <div class="hero">
    <span class="hero-num" id="heroTheta">0°</span>
    <span class="hero-dir" id="heroDir">正对屏幕</span>
  </div>
</header>

<aside id="rail" aria-label="视角"></aside>

<aside id="panel" aria-label="设置">
  <nav id="tabs" role="tablist">
    <button data-tab="view" class="on" role="tab">视角</button>
    <button data-tab="device" role="tab">机型</button>
    <button data-tab="screen" role="tab">画面</button>
    <span class="tabs-fold" aria-hidden="true"></span>
  </nav>
  <div id="panelBody">

    <!-- ===== 视角 ===== -->
    <section class="sec" data-tab="view" id="secPad">
      <div class="sec-head">
        <h2>观看方向</h2>
        <div class="seg mini" id="padMetric">
          <button data-v="lum" class="on">亮度</button>
          <button data-v="jncd">色偏</button>
        </div>
      </div>
      <div class="pad-grid">
        <div class="pad-wrap">
          <canvas id="pad" aria-label="观看方向：拖动设置眼睛相对屏幕的位置"></canvas>
        </div>
        <div class="pad-side">
          <div class="pad-legend">
            <div class="pad-scale">
              <div class="ramp" id="padRamp"></div>
              <div class="ramp-ticks" id="padTicks"></div>
            </div>
            <select id="palette" data-styled class="mini-select" aria-label="热力图配色" title="热力图配色（方向盘与离轴角分布共用）"></select>
          </div>
          <div class="angle-row">
            <div class="chips" id="thetaChips">
              <button data-t="0">0°</button>
              <button data-t="30">30°</button>
              <button data-t="45">45°</button>
              <button data-t="60">60°</button>
              <button data-t="70">70°</button>
            </div>
            <button id="sweep" class="play" title="自动扫描 0°→70°（空格）"><span class="ico"></span><span class="lbl">扫描</span></button>
          </div>
        </div>
      </div>
    </section>

    <section class="sec" data-tab="view" data-wide="panel" id="secDist">
      <div class="row-title"><span>观看距离</span><b id="distV">30 cm</b></div>
      <input type="range" id="dist" min="10" max="100" step="1" value="30" aria-label="观看距离">
    </section>

    <section class="sec" data-tab="view" id="secCurve">
      <div class="sec-head">
        <h2>随离轴角变化</h2>
      </div>
      <div class="legend-row" id="curveLegend"></div>
      <div id="charts"></div>
    </section>

    <!-- ===== 机型 ===== -->
    <section class="sec" data-tab="device" id="secMode">
      <div class="seg" id="compare">
        <button data-v="0" class="on">单台</button>
        <button data-v="1">双机对比</button>
        <button data-v="2">双眼立体</button>
      </div>
      <button type="button" id="open3d" class="more-btn">进入三维场景演示 ↗</button>
    </section>

    <section class="sec" data-tab="device" id="secDevice">
      <h2>机型</h2>
      <select id="deviceSelect" data-styled data-label="机型" aria-label="机型"></select>
      <label class="switch-row" id="privacyRow">
        <span id="privacyText">防窥模式</span>
        <input type="checkbox" id="privacy"><span class="switch"></span>
      </label>
    </section>

    <section class="sec" data-tab="device" id="secSlots" hidden>
      <h2>对比组合</h2>
      <select id="presets" data-styled data-label="对比组合" aria-label="对比组合"></select>
      <label class="slot"><span class="key" style="--k:var(--s1)"></span><select id="slot0" data-styled aria-label="左侧机型"></select></label>
      <label class="slot"><span class="key" style="--k:var(--s2)"></span><select id="slot1" data-styled aria-label="右侧机型"></select></label>
    </section>

    <section class="sec" data-tab="device" id="stereoGroup" hidden>
      <h2>双眼立体</h2>
      <div class="seg" id="stereoView">
        <button data-v="0" class="on">平行视</button>
        <button data-v="1">交叉视</button>
      </div>
      <div class="row-title"><span>画面大小</span><b id="sizeV">100%</b></div>
      <input type="range" id="size" min="40" max="100" step="5" value="100">
      <div class="row-title"><span>中间间隙</span><b id="gapV">8 px</b></div>
      <input type="range" id="gap" min="0" max="200" step="2" value="8">
      <div class="row-title"><span>瞳距</span><b id="ipdV">63 mm</b></div>
      <input type="range" id="ipd" min="54" max="72" step="1" value="63">
      <span id="sepInfo" hidden></span>
    </section>

    <section class="sec" data-tab="device" id="secColors">
      <h2>机身颜色</h2>
      <div id="colors"></div>
    </section>

    <!-- ===== 画面 ===== -->
    <section class="sec" data-tab="screen" id="secPattern">
      <h2>屏幕内容</h2>
      <select id="patterns" data-styled data-label="屏幕内容" aria-label="屏幕内容">
        <option value="ui">浅色设置</option>
        <option value="dark">深色设置</option>
        <option value="read">阅读</option>
        <option value="white">纯白</option>
        <option value="rgbw">三原色</option>
        <option value="checker">色卡</option>
        <option value="gray">灰阶</option>
        <option value="upload">上传图片…</option>
      </select>
      <input type="file" id="file" accept="image/*" hidden>
    </section>

    <section class="sec" data-tab="screen" id="secDisplay">
      <h2>显示方式</h2>
      <div class="seg" id="mode">
        <button data-v="0" class="on">仿真效果</button>
        <button data-v="1">原图</button>
        <button data-v="2">离轴角分布</button>
      </div>
      <div id="legend">
        <div class="ramp" id="angRamp"></div>
        <div class="ramp-ticks"><span>0°</span><span>35°</span><span>70°</span></div>
      </div>
      <div class="seg" id="orient">
        <button data-v="0" class="on">竖屏</button>
        <button data-v="90">横屏</button>
      </div>
    </section>

    <section class="sec" data-tab="screen" id="secHelp">
      <details class="keys-box">
      <summary>快捷键</summary>
      <dl class="keys">
        <dt>拖动画面</dt><dd>转动手机</dd>
        <dt>滚轮</dt><dd>观看距离</dd>
        <dt>方向键</dt><dd>微调 2°</dd>
        <dt>空格</dt><dd>自动扫描</dd>
        <dt>H</dt><dd>隐藏界面（录屏）</dd>
        <dt>双击 / 0</dt><dd>回到正对</dd>
        <dt>P</dt><dd>防窥开关</dd>
      </dl>
      </details>
    </section>

  </div>
</aside>

<div id="tip" role="status"></div>
<div id="tip2"></div>
<div class="caption" id="cap0"></div>
<div class="caption" id="cap1"></div>
<div id="toast"></div>
<div id="hint">拖动画面转动手机 · 拖动左侧方向盘直接选角度 · 滚轮调距离 · 空格自动扫描</div>
<div id="drop">松开以加载图片</div>

<script src="data.js"></script>
<script src="model.js?v=12"></script>
<script src="avatar.js"></script>
<script src="patterns.js?v=12"></script>
<script src="devices.js"></script>
<script src="phone3d.js"></script>
<script src="viz.js?v=12"></script>
<!-- 三维场景（scene3d-person.js、scene3d.js）只在进入场景演示时再加载，见 app.js -->
<script src="dropdown.js?v=1"></script>
<script src="app.js?v=16"></script>
</body>
</html>
